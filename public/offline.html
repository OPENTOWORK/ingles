<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/mascot/1.png" type="image/png">
  <title>Sin conexión — Dralo Academy</title>
  <script>
    (function () {
      var target = '/sw-reset.html';
      function go() { window.location.replace(target); }
      if (!('serviceWorker' in navigator)) { go(); return; }
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
        .then(function () {
          if (!('caches' in window)) { go(); return; }
          return caches.keys().then(function (names) {
            return Promise.all(names.map(function (n) { return caches.delete(n); }));
          });
        })
        .then(go)
        .catch(go);
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-align: center;
      padding: 1.5rem;
    }
    p { font-size: 1.1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <p>Restaurando acceso… Si no avanza, abre <strong>dralo.es/sw-reset.html</strong></p>
</body>
</html>
