<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/mascot/1.png" type="image/png">
    <title>Offline - Dralo Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .offline-features {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .offline-features h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
            text-align: center;
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .feature-icon {
            margin-right: 0.75rem;
            font-size: 1.2rem;
        }

        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
        }

        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 600px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">
        <span class="status-dot"></span>
        <span>Checking connection...</span>
    </div>

    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Don't worry! You can still practice English even without an internet connection.</p>
        
        <div class="offline-features">
            <h3>Available Offline</h3>
            <div class="feature">
                <span class="feature-icon">📚</span>
                <span>Previously loaded exercises</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎧</span>
                <span>Cached audio files</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📊</span>
                <span>Your progress tracking</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🏆</span>
                <span>Achievement system</span>
            </div>
        </div>

        <a href="/training" class="retry-button">Continue Practicing</a>
        <button type="button" id="retryButton" class="retry-button">Try Again</button>

        <div class="status-indicator" id="statusIndicator">
            <span class="status-dot"></span>
            <span>Offline Mode</span>
        </div>
    </div>

    <script>
        let returningOnline = false;

        async function clearServiceWorkerAndCaches() {
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map((registration) => registration.unregister()));
            }
            if ('caches' in window) {
                const names = await caches.keys();
                await Promise.all(names.map((name) => caches.delete(name)));
            }
        }

        async function returnToApp() {
            if (returningOnline) return;
            returningOnline = true;
            try {
                await clearServiceWorkerAndCaches();
            } catch {
                /* ignore */
            }
            window.location.replace('/');
        }

        async function probeConnection() {
            try {
                const response = await fetch('/?offline_probe=1', {
                    method: 'HEAD',
                    cache: 'no-store',
                    credentials: 'same-origin',
                });
                return response.status > 0 && response.status < 500;
            } catch {
                return false;
            }
        }

        async function updateConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');
            const statusIndicator = document.getElementById('statusIndicator');
            const online = navigator.onLine && await probeConnection();

            if (online) {
                statusElement.innerHTML = `
                    <span style="background: #4ade80; animation: none;"></span>
                    <span>Connected</span>
                `;
                statusIndicator.innerHTML = `
                    <span style="background: #4ade80; animation: none;"></span>
                    <span>Online Mode</span>
                `;
                setTimeout(returnToApp, 1200);
            } else {
                statusElement.innerHTML = `
                    <span class="status-dot"></span>
                    <span>Offline</span>
                `;
                statusIndicator.innerHTML = `
                    <span class="status-dot"></span>
                    <span>Offline Mode</span>
                `;
            }
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        updateConnectionStatus();
        setInterval(updateConnectionStatus, 8000);

        document.getElementById('retryButton')?.addEventListener('click', returnToApp);
    </script>
</body>
</html>
