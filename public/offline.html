<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - English Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .offline-features {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .offline-features h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
            text-align: center;
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .feature-icon {
            margin-right: 0.75rem;
            font-size: 1.2rem;
        }

        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
        }

        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 600px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">
        <span class="status-dot"></span>
        <span>Checking connection...</span>
    </div>

    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Don't worry! You can still practice English even without an internet connection.</p>
        
        <div class="offline-features">
            <h3>Available Offline</h3>
            <div class="feature">
                <span class="feature-icon">📚</span>
                <span>Previously loaded exercises</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎧</span>
                <span>Cached audio files</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📊</span>
                <span>Your progress tracking</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🏆</span>
                <span>Achievement system</span>
            </div>
        </div>

        <a href="/training" class="retry-button">Continue Practicing</a>
        <button onclick="window.location.reload()" class="retry-button">Try Again</button>

        <div class="status-indicator" id="statusIndicator">
            <span class="status-dot"></span>
            <span>Offline Mode</span>
        </div>
    </div>

    <script>
        // Connection status monitoring
        function updateConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');
            const statusIndicator = document.getElementById('statusIndicator');
            
            if (navigator.onLine) {
                statusElement.innerHTML = `
                    <span style="background: #4ade80; animation: none;"></span>
                    <span>Connected</span>
                `;
                statusIndicator.innerHTML = `
                    <span style="background: #4ade80; animation: none;"></span>
                    <span>Online Mode</span>
                `;
                
                // Redirect to main app after a short delay
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } else {
                statusElement.innerHTML = `
                    <span class="status-dot"></span>
                    <span>Offline</span>
                `;
                statusIndicator.innerHTML = `
                    <span class="status-dot"></span>
                    <span>Offline Mode</span>
                `;
            }
        }

        // Listen for connection changes
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // Initial status check
        updateConnectionStatus();

        // Periodic connection check
        setInterval(() => {
            fetch('/', { method: 'HEAD', mode: 'no-cors' })
                .then(() => {
                    if (!navigator.onLine) {
                        // Force online status update
                        window.dispatchEvent(new Event('online'));
                    }
                })
                .catch(() => {
                    // Still offline
                });
        }, 5000);

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(registration => {
                console.log('Service Worker ready');
            });
        }

        // Add some interactive elements
        document.addEventListener('DOMContentLoaded', () => {
            // Add click animation to buttons
            const buttons = document.querySelectorAll('.retry-button');
            buttons.forEach(button => {
                button.addEventListener('click', (e) => {
                    e.target.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        e.target.style.transform = 'translateY(-2px)';
                    }, 150);
                });
            });
        });
    </script>
</body>
</html>
