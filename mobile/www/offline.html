<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dralo Academy</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #4f46e5 0%, #667eea 55%, #764ba2 100%);
        color: #fff;
      }
      main { width: min(100%, 26rem); text-align: center; }
      h1 { margin: 0 0 0.5rem; font-size: 1.75rem; font-weight: 750; }
      p { margin: 0 0 1.5rem; line-height: 1.5; font-size: 1.05rem; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.9rem 1.4rem;
        font: inherit;
        font-weight: 700;
        color: #312e81;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dralo Academy</h1>
      <p>No hay conexión ahora mismo. Cuando vuelva la red, entra otra vez en la misma cuenta y la misma práctica.</p>
      <button type="button" onclick="location.replace('https://www.dralo.es/')">Reintentar</button>
    </main>
  </body>
</html>
