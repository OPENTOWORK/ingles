# Subidas de iOS desde Codemagic. El .aab de Android también puede salir de aquí.
# En la UI de Codemagic hay que crear antes:
#   - iOS: integración de App Store Connect y el identificador es.dralo.academy
#   - Android: un code signing "dralo_upload" con android/app/dralo-upload.keystore
# La app abre https://www.dralo.es (la misma web y la misma Supabase).

workflows:
  ios-app-store:
    name: Dralo iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: es.dralo.academy
      ios_signing:
        distribution_type: app_store
        bundle_identifier: es.dralo.academy
    scripts:
      - name: Dependencias
        script: npm ci
      - name: Proyecto iOS
        script: npx cap sync ios
      - name: Firma
        script: xcode-project use-profiles
      - name: IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-aab:
    name: Dralo Android App Bundle
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      java: 21
      node: 22
      android_signing:
        - dralo_upload
      groups:
        - google_play
    scripts:
      - name: Dependencias
        script: npm ci
      - name: Proyecto Android
        script: npx cap sync android
      - name: App Bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
