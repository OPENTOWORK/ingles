name: B1 Reading Motor CI

on:
  push:
    branches:
      - audit/ruoe-b1-safeguards-20261112
  pull_request:
    branches:
      - main

jobs:
  b1-reading-motor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:b1-reading-motor
